[package]
name = "blog-admin"
version = "0.1.0"
description = "博客管理后台"
edition = "2021"

[[bin]]
name = "blog-admin"
path = "src/main.rs"

[profile.release]
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
walkdir = "2"
anyhow = "1"
log = "0.4"
